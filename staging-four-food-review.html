<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>POTOK · Подтверждение КБЖУ трёх продуктов</title>
    <style>
      body { font: 1.05rem/1.5 system-ui, sans-serif; color: #17312a; background: #f4faf7; }
      main { max-width: 34rem; margin: 8vh auto; padding: 1rem; }
      button, a { display: inline-block; margin: .4rem .8rem .4rem 0; padding: .7rem 1rem; font: inherit; }
      button { background: #125943; color: white; border: 0; border-radius: .6rem; }
      button:disabled { opacity: .55; }
      a { color: #125943; }
    </style>
  </head>
  <body>
    <main>
      <h1>Подтверждение КБЖУ трёх продуктов</h1>
      <p>Войди в тестовый POTOK в этом браузере, затем вернись на эту страницу.</p>
      <a href="/" target="_blank" rel="noopener">Открыть тестовый POTOK</a>
      <button id="check" type="button" disabled>Проверить права</button>
      <p id="result" role="status"></p>
      <section id="recipe-review" hidden>
        <h2>Продукты</h2>
        <p>Куриная грудка, красный сладкий перец и говяжий фарш 15%.</p>
        <button id="approve-cards" type="button">Подтвердить КБЖУ трёх продуктов</button>
        <p id="recipe-review-result" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/stagingFourFoodReviewMain.ts"></script>
  </body>
</html>
