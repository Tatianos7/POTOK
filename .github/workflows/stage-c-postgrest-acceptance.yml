name: Stage C disposable PostgREST JWT and COMMIT acceptance
on:
  pull_request:
    paths:
      - 'scripts/contracts/stage-c-*'
      - 'scripts/contracts/shared-food-eligibility-disposable-db-v1.test.ts'
      - 'supabase/migration_drafts/*.sql'
      - '.github/workflows/stage-c-postgrest-acceptance.yml'
permissions:
  contents: read
jobs:
  transport:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: postgres:17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned PostgREST official static asset and verify SHA256
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates xz-utils
          curl --fail --location --retry 2 -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v13.0.7/postgrest-v13.0.7-linux-static-x86-64.tar.xz
          printf '%s  %s\n' '4153f81ccc40e7b735edc89cd84b49da25ba27eb37d57c7f6a82c9005a0b762b' '/tmp/postgrest.tar.xz' | sha256sum --check
          tar -xJf /tmp/postgrest.tar.xz -C /usr/local/bin postgrest
          postgrest --version
      - name: Strict transport test TypeScript and ESLint
        run: |
          npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node scripts/contracts/stage-c-transport-disposable-db-v1.test.ts scripts/contracts/stage-c-transport-outcome.test.ts
          npx eslint scripts/contracts/stage-c-postgrest-acceptance.ts scripts/contracts/stage-c-pg-wire-faults.ts scripts/contracts/stage-c-transport-outcome.ts scripts/contracts/stage-c-transport-outcome.test.ts scripts/contracts/stage-c-transport-disposable-db-v1.test.ts --max-warnings 0
      - name: Real disposable database, JWT, PostgREST and protocol fault tests (no SKIP)
        run: |
          runuser -u postgres -- env PATH="$PATH" POTOK_FOOD_EVIDENCE_REQUIRE_DB=1 POTOK_STAGE_C_REQUIRE_TRANSPORT=1 node --import tsx --test --test-isolation=none scripts/contracts/stage-c-transport-disposable-db-v1.test.ts scripts/contracts/stage-c-transport-outcome.test.ts
