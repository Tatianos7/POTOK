name: Catalog authority and immutable history acceptance
on:
  pull_request:
    paths:
      - 'scripts/security/catalog-authority/**'
      - 'scripts/security/data-api-explicit-grants/**'
      - 'src/services/foodIngestionService.ts'
      - 'supabase/migration_drafts/catalog_authority_history_review_v1.sql'
      - 'supabase/migration_drafts/202608*'
      - 'supabase/food_ingestion_schema.sql'
      - 'docs/premium/drafts/20260921_trusted_entitlement_v2.sql'
      - '.github/workflows/catalog-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: potok_catalog_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d potok_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/security/data-api-explicit-grants --ignore-scripts
      - name: Actual public admin RPC/policy and verified-reader source acceptance
        env:
          TEST_DATABASE_URL: postgres://test_admin:disposable-test-only@127.0.0.1:5432/potok_catalog_test
          SQL_TEST_PG_MODULE: ${{ github.workspace }}/scripts/security/data-api-explicit-grants/node_modules/pg/lib/index.js
        run: node scripts/security/catalog-authority/test.mjs
  real-auth-postgrest:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Initialize unlinked local project
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          set -e
          umask 077
          mkdir "$POTOK_PHOTO_AUTH_DIR"
          supabase init --workdir "$POTOK_PHOTO_AUTH_DIR"
          node scripts/security/data-api-explicit-grants/local-prepare.mjs config
      - name: Start loopback-only Auth, Mailpit and REST
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          set -e
          umask 077
          docker network create -o 'com.docker.network.bridge.host_binding_ipv4=127.0.0.1' potok-photo-http-acceptance
          if ! supabase start --workdir "$POTOK_PHOTO_AUTH_DIR" --network-id potok-photo-http-acceptance --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$POTOK_PHOTO_AUTH_DIR/start.log" 2>&1; then
            echo 'Disposable startup failed; logs remain private.'
            exit 1
          fi
          supabase status --workdir "$POTOK_PHOTO_AUTH_DIR" -o json > "$POTOK_PHOTO_AUTH_DIR/status.json" 2> "$POTOK_PHOTO_AUTH_DIR/status.log"
          node scripts/security/data-api-explicit-grants/local-prepare.mjs database
      - name: Photo regression then actual catalog authority/history API acceptance
        timeout-minutes: 5
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          set -e
          node scripts/security/data-api-explicit-grants/http.mjs
          node scripts/security/catalog-authority/http.mjs
      - name: Stop only disposable project
        if: always()
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          supabase stop --workdir "$POTOK_PHOTO_AUTH_DIR" --no-backup > "$RUNNER_TEMP/potok-catalog-stop.log" 2>&1 || true
          docker network rm potok-photo-http-acceptance > /dev/null 2>&1 || true
