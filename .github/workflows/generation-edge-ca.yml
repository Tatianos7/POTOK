name: Local Supabase Edge certificate compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/server/generationRootCaV1.ts'
      - 'src/server/generationNodePgPoolV1.ts'
      - 'src/server/generationRuntimeV1.ts'
      - 'src/server/__tests__/generationRootCa*'
      - 'scripts/security/generation-profile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generation-edge-ca.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local_edge_ca:
    name: Synthetic CA checks in Supabase Edge Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build isolated certificate canary
        run: node --import tsx scripts/security/generation-profile/build-ca-canary.ts "$RUNNER_TEMP/potok-edge-ca"
      - name: Run pinned official Edge Runtime locally
        run: |
          docker run -d --name potok-edge-ca --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=128m -e DENO_DIR=/tmp/deno \
            -p 127.0.0.1:9099:9000 \
            --mount "type=bind,src=$RUNNER_TEMP/potok-edge-ca,dst=/service,readonly" \
            supabase/edge-runtime@sha256:6b850a2ccf0bf50ecac9accff8098095cd191c389c2a53c59b857aa0f53a8343 \
            start --main-service /service
      - name: Check synthetic certificate results
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:9099/ > "$RUNNER_TEMP/edge-ca-result.json"; then break; fi
            sleep 1
          done
          node --input-type=module - "$RUNNER_TEMP/edge-ca-result.json" <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(r.contract,'potok-local-edge-ca-canary-v1');
          assert.equal(r.hostedAcceptance,false);assert.equal(r.workerExecutionTested,false);
          assert.equal(r.results.length,9);assert.ok(r.results.every(x=>x.pass===true));
          console.log(JSON.stringify(r));
          JS
      - name: Diagnostic logs
        if: failure()
        run: docker logs potok-edge-ca
      - name: Stop only the diagnostic container
        if: always()
        run: docker rm -f potok-edge-ca || true
