name: POTOK PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only validation. No deployment, Supabase access or app secrets.
permissions:
  contents: read

concurrency:
  group: potok-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, build and nutrition tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript and production build (no deployment)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Diary contract tests
        run: npm run test:diary

      - name: Catalog import preserves historical diary snapshots
        run: node --test scripts/security/catalog-authority/food-import-snapshot-preservation.test.mjs

      - name: Legacy Premium client containment regressions
        run: node --test scripts/security/legacy-premium/observations.test.mjs

      - name: Legacy program quarantine and execution annotation regressions
        run: node --test scripts/security/legacy-plan-quarantine/client.test.mjs scripts/security/legacy-plan-quarantine/execution-transition.test.mjs

      - name: Entitlement account scope and Free compatibility
        run: npx --no-install tsx --test src/services/__tests__/entitlementService.account-scope.test.ts

      # Nutrition Integrity V1 lives in an unmerged Draft PR.
      # Once included in a checked-out PR, run its isolated pure tests too.
      - name: Nutrition Integrity V1 contract tests when present
        shell: bash
        run: |
          if [ -f src/utils/__tests__/nutritionIntegrityV1.test.ts ]; then
            tests=(src/utils/__tests__/nutritionIntegrityV1.test.ts)
            if [ -f src/server/__tests__/nutritionIntegrityReviewedEvidenceAdapterV1.test.ts ]; then
              tests+=(src/server/__tests__/nutritionIntegrityReviewedEvidenceAdapterV1.test.ts)
            fi
            if [ -f src/server/__tests__/nutritionIntegrityAtomicReadPortV1.test.ts ]; then
              tests+=(src/server/__tests__/nutritionIntegrityAtomicReadPortV1.test.ts)
            fi
            npx --no-install tsx --test "${tests[@]}"
          else
            echo "Nutrition Integrity V1 tests are not present in this PR; skipping."
          fi

      - name: P5-01 pending generation read-only regressions
        run: |
          npx --no-install tsx --test \
            src/services/__tests__/adaptiveNutritionReadOnlyService.test.ts \
            src/services/__tests__/adaptiveNutritionReadOnlyEntry.test.ts \
            src/components/__tests__/AdaptiveNutritionReadOnlyEntry.test.tsx

      - name: P5-02 adaptive persistence and UNKNOWN recovery regressions
        run: |
          npx --no-install tsx --test \
            src/services/__tests__/adaptiveNutritionPersistenceService.test.ts \
            src/services/__tests__/adaptiveNutritionTodayRuntime.test.ts \
            scripts/contracts/adaptive-nutrition-error-contract-v1.test.ts

      - name: P5-03 and P5-03B source evidence regressions
        run: |
          npx --no-install tsx --test \
            scripts/contracts/p5-03-cottage-cheese-apple-evidence.test.ts \
            scripts/contracts/p5-03b-oatmeal-apple-evidence.test.ts
