name: Private program fixture rollback rehearsal
on:
  pull_request:
    paths:
      - 'scripts/security/backup-readiness/program-fixture*'
      - 'scripts/security/backup-readiness/program-client*'
      - '.github/workflows/program-fixture-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-auth-postgrest:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Bounded diary/photo writes and existing preservation policy
        run: node --test scripts/security/backup-readiness/scoped-writes.test.mjs scripts/security/backup-readiness/post-acl-reads.test.mjs
      - name: Restricted local browser gateway protocol
        run: node --test scripts/security/combined-api/private-gateway.test.mjs
      - name: Private browser package policy
        run: node --test scripts/security/accumulated/private-browser.test.mjs
      - name: Public browser build recovery policy
        run: node --test scripts/security/accumulated/private-browser-resume.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Initialize unlinked local project
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          set -e
          umask 077
          mkdir "$POTOK_PHOTO_AUTH_DIR"
          supabase init --workdir "$POTOK_PHOTO_AUTH_DIR"
          node scripts/security/data-api-explicit-grants/local-prepare.mjs config
          node scripts/security/combined-api/local-prepare.mjs config
      - name: Start loopback-only Auth, Mailpit and REST
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          set -e
          umask 077
          docker network create -o 'com.docker.network.bridge.host_binding_ipv4=127.0.0.1' potok-photo-http-acceptance
          if ! supabase start --workdir "$POTOK_PHOTO_AUTH_DIR" --network-id potok-photo-http-acceptance --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$POTOK_PHOTO_AUTH_DIR/start.log" 2>&1; then
            echo 'Disposable startup failed; logs remain private.'
            exit 1
          fi
          supabase status --workdir "$POTOK_PHOTO_AUTH_DIR" -o json > "$POTOK_PHOTO_AUTH_DIR/status.json" 2> "$POTOK_PHOTO_AUTH_DIR/status.log"
          node scripts/security/data-api-explicit-grants/local-prepare.mjs database
      - name: Eight committed candidates with real OTP and API/service acceptance
        timeout-minutes: 5
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: node scripts/security/combined-api/api.mjs
      - name: Program fixture source guards
        run: node --test scripts/security/backup-readiness/program-fixture.test.mjs scripts/security/backup-readiness/program-client.test.mjs
      - name: Real Supabase SQL roles and rollback for new bounded program fixtures
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: node scripts/security/backup-readiness/program-fixture-ci.mjs
      - name: Actual program client and bounded committed fixture cleanup
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: node scripts/security/backup-readiness/program-client-ci.mjs
      - name: Stop only disposable project
        if: always()
        env:
          POTOK_PHOTO_AUTH_DIR: ${{ runner.temp }}/potok-photo-http-acceptance
        run: |
          supabase stop --workdir "$POTOK_PHOTO_AUTH_DIR" --no-backup > "$RUNNER_TEMP/potok-program-rehearsal-stop.log" 2>&1 || true
          docker network rm potok-photo-http-acceptance > /dev/null 2>&1 || true
