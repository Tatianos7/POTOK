name: Local Supabase Edge full worker compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/server/**'
      - 'src/domain/**'
      - 'scripts/security/generation-profile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generation-edge-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local_edge_worker:
    name: Synthetic full worker and TLS in limited Edge user workers
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare ephemeral local TLS and narrow PostgreSQL roles
        run: |
          mkdir -p "$RUNNER_TEMP/potok-edge-db" "$RUNNER_TEMP/potok-edge-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=POTOK-CI-CA -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign -keyout "$RUNNER_TEMP/potok-edge-certs/ca.key" -out "$RUNNER_TEMP/potok-edge-certs/ca.pem" 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=POTOK-CI-Wrong-CA -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign -keyout "$RUNNER_TEMP/potok-edge-certs/wrong.key" -out "$RUNNER_TEMP/potok-edge-certs/wrong.pem" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=potok-profile-db -keyout "$RUNNER_TEMP/potok-edge-db/server.key" -out "$RUNNER_TEMP/potok-edge-certs/server.csr" 2>/dev/null
          echo 'subjectAltName=DNS:potok-profile-db' > "$RUNNER_TEMP/potok-edge-certs/server.ext"
          openssl x509 -req -in "$RUNNER_TEMP/potok-edge-certs/server.csr" -CA "$RUNNER_TEMP/potok-edge-certs/ca.pem" -CAkey "$RUNNER_TEMP/potok-edge-certs/ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/potok-edge-certs/server.ext" -out "$RUNNER_TEMP/potok-edge-db/server.pem" 2>/dev/null
          cat > "$RUNNER_TEMP/potok-edge-db/init.sql" <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE potok_generation_reader_v1 LOGIN PASSWORD 'fixture-only-password' NOINHERIT CONNECTION LIMIT 2;
          CREATE ROLE potok_generation_gateway_v1 LOGIN PASSWORD 'fixture-only-password' NOINHERIT CONNECTION LIMIT 2;
          SQL
          sudo chown 70:70 "$RUNNER_TEMP/potok-edge-db/server.key"
          sudo chmod 600 "$RUNNER_TEMP/potok-edge-db/server.key"
          docker network create potok-edge-diagnostic
          docker run -d --name potok-profile-db --network potok-edge-diagnostic \
            -e POSTGRES_PASSWORD=ephemeral-ci-admin-only \
            --mount "type=bind,src=$RUNNER_TEMP/potok-edge-db,dst=/fixture,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/potok-edge-db/init.sql,dst=/docker-entrypoint-initdb.d/init.sql,readonly" \
            postgres:17-alpine -c ssl=on -c ssl_cert_file=/fixture/server.pem -c ssl_key_file=/fixture/server.key
          for attempt in $(seq 1 30); do
            if docker exec potok-profile-db pg_isready -U postgres; then break; fi
            sleep 1
          done
      - name: Build CI-only worker services with bundled pinned pg
        run: node --import tsx scripts/security/generation-profile/build-edge-worker-canary.ts "$RUNNER_TEMP/potok-edge-worker" "$RUNNER_TEMP/potok-edge-certs/ca.pem" "$RUNNER_TEMP/potok-edge-certs/wrong.pem"
      - name: Run official Edge Runtime with separate limited user workers
        run: |
          docker run -d --name potok-edge-worker --network potok-edge-diagnostic \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,size=128m -e DENO_DIR=/tmp/deno -p 127.0.0.1:9098:9000 \
            --mount "type=bind,src=$RUNNER_TEMP/potok-edge-worker,dst=/service,readonly" \
            supabase/edge-runtime@sha256:6b850a2ccf0bf50ecac9accff8098095cd191c389c2a53c59b857aa0f53a8343 \
            start --main-service /service/main
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9098/health; then break; fi
            sleep 1
          done
      - name: Verify live local TLS and record full-worker resource outcomes
        run: node scripts/security/generation-profile/check-edge-worker-canary.mjs "$RUNNER_TEMP/edge-worker-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-edge-worker-observation
          path: ${{ runner.temp }}/edge-worker-result.json
          if-no-files-found: ignore
      - name: Diagnostic Edge logs
        if: always()
        run: docker logs potok-edge-worker || true
      - name: Remove only diagnostic containers and network
        if: always()
        run: |
          docker rm -f potok-edge-worker potok-profile-db || true
          docker network rm potok-edge-diagnostic || true
