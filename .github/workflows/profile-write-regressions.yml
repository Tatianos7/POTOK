name: Profile write regressions
on:
  pull_request:
    paths:
      - 'supabase/migration_drafts/profile_column_write_containment_v1.sql'
      - 'scripts/security/profile-writes/**'
      - '.github/workflows/profile-write-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: potok_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d potok_profile_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test driver
        run: npm install --prefix "$RUNNER_TEMP/potok-sql-test" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Check protected column denial, upsert and RLS
        run: node scripts/security/profile-writes/test.mjs
        env:
          SQL_TEST_PG_MODULE: ${{ runner.temp }}/potok-sql-test/node_modules/pg/lib/index.js
          TEST_DATABASE_URL: postgres://test_admin:disposable-ci-only@127.0.0.1:5432/potok_profile_test
