name: Twelve candidate restored rollback and private commit protocol
on:
  pull_request:
    paths:
      - 'scripts/security/accumulated/**'
      - 'scripts/security/backup-readiness/strict-twelve*'
      - 'scripts/security/backup-readiness/candidate-rights*'
      - 'scripts/security/backup-readiness/post-acl-reads*'
      - 'scripts/security/backup-readiness/rights-rehearsal.mjs'
      - 'scripts/security/platform-defaults/**'
      - 'scripts/security/program-reads/**'
      - 'scripts/security/program-history/**'
      - 'scripts/security/legacy-plan-quarantine/**'
      - 'scripts/security/server-premium/paywall-review.sql'
      - 'supabase/phase7_2*.sql'
      - 'scripts/security/catalog-authority/fixture.mjs'
      - 'supabase/migration_drafts/**'
      - 'supabase/phase7_3_2_monetization.sql'
      - 'supabase/food_ingestion_schema.sql'
      - 'supabase/migrations/2026022*'
      - 'docs/premium/drafts/20260921_trusted_entitlement_v2.sql'
      - '.github/workflows/restored-twelve.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: potok_restored_twelve_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d potok_restored_twelve_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/security/data-api-explicit-grants --ignore-scripts
      - name: Twelve candidates, rollback, isolated private commit and independent committed checks
        env:
          TEST_DATABASE_URL: postgres://test_admin:disposable-test-only@127.0.0.1:5432/potok_restored_twelve_test
          SQL_TEST_PG_MODULE: ${{ github.workspace }}/scripts/security/data-api-explicit-grants/node_modules/pg/lib/index.js
        run: node scripts/security/accumulated/restored-twelve.test.mjs
  isolated-candidate-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --prefix scripts/security/data-api-explicit-grants --ignore-scripts
      - name: Cache only the four pinned public remote inputs
        run: |
          mkdir -p "$RUNNER_TEMP/potok-public-inputs"
          node --input-type=module -e '
          import fs from "node:fs/promises";
          import {createHash} from "node:crypto";
          import {inputs} from "./scripts/security/accumulated/inputs.mjs";
          for(const i of inputs.filter(i=>!i.local)){
          const r=await fetch(`https://raw.githubusercontent.com/Tatianos7/POTOK/${i.ref}/${i.path}`,{redirect:"error",signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error("Public input unavailable");const bytes=Buffer.from(await r.arrayBuffer());
          if(createHash("sha256").update(bytes).digest("hex")!==i.sha256)throw Error("Public input changed");
          await fs.writeFile(process.env.RUNNER_TEMP+"/potok-public-inputs/"+(i.key==="anonymous"?"rpc":i.key)+".sql",bytes);
          }'
      - name: PostgreSQL and Node share one isolated network namespace; no published ports
        run: |
          set -euo pipefail
          trap 'docker rm -f potok_candidate_acl_native >/dev/null 2>&1 || true' EXIT
          docker run --detach --name potok_candidate_acl_native --network none --env POSTGRES_USER=test_admin --env POSTGRES_PASSWORD=disposable-test-only --env POSTGRES_DB=potok_restored_twelve_test postgres:17 -c listen_addresses=127.0.0.1 -c cron.launch_active_jobs=off
          for attempt in $(seq 1 60); do
            if docker exec potok_candidate_acl_native pg_isready -h 127.0.0.1 -U test_admin -d potok_restored_twelve_test >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec potok_candidate_acl_native pg_isready -h 127.0.0.1 -U test_admin -d potok_restored_twelve_test
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user node --network container:potok_candidate_acl_native --tmpfs /tmp:rw,nosuid,nodev,size=64m --mount "type=bind,source=$GITHUB_WORKSPACE/scripts,target=/work/scripts,readonly" --mount "type=bind,source=$GITHUB_WORKSPACE/supabase,target=/work/supabase,readonly" --mount "type=bind,source=$GITHUB_WORKSPACE/docs,target=/work/docs,readonly" --mount "type=bind,source=$RUNNER_TEMP/potok-public-inputs,target=/public-inputs,readonly" --workdir /work --env TEST_DATABASE_URL=postgres://test_admin:disposable-test-only@127.0.0.1:5432/potok_restored_twelve_test --env SQL_TEST_PG_MODULE=/work/scripts/security/data-api-explicit-grants/node_modules/pg/lib/index.js --env ACCUMULATED_INPUT_DIR=/public-inputs --env CANDIDATE_ACL_NATIVE=1 node:24.22.1-alpine3.23 node scripts/security/accumulated/restored-twelve.test.mjs
