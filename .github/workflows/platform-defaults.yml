name: Managed platform defaults SQL boundary
on:
  pull_request:
    paths:
      - 'scripts/security/platform-defaults/**'
      - 'scripts/security/catalog-authority/fixture.mjs'
      - 'supabase/migration_drafts/**'
      - 'supabase/phase7_3_2_monetization.sql'
      - 'supabase/food_ingestion_schema.sql'
      - 'supabase/migrations/2026022*'
      - 'docs/premium/drafts/20260921_trusted_entitlement_v2.sql'
      - '.github/workflows/platform-defaults.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: potok_platform_defaults_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d potok_platform_defaults_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/security/data-api-explicit-grants --ignore-scripts
      - name: Read-only managed defaults classification and negative cases
        env:
          TEST_DATABASE_URL: postgres://test_admin:disposable-test-only@127.0.0.1:5432/potok_platform_defaults_test
          SQL_TEST_PG_MODULE: ${{ github.workspace }}/scripts/security/data-api-explicit-grants/node_modules/pg/lib/index.js
        run: node scripts/security/platform-defaults/test.mjs
