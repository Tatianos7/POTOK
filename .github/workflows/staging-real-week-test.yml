name: Staging real-recipe week test (no deployment or database)
on:
  pull_request:
    paths:
      - 'src/server/stagingRealWeekApiV1.ts'
      - 'src/server/referenceSavedGoalReaderV1.ts'
      - 'src/server/__tests__/referenceSavedGoalReaderV1.test.ts'
      - 'src/dev/referenceSavedGoalV1.ts'
      - 'src/server/__tests__/stagingRealWeekApiV1.test.ts'
      - 'src/services/stagingRealWeek.ts'
      - 'src/dev/referenceRecipeExclusionsV1.ts'
      - 'src/dev/referenceStapleVarietyV1.ts'
      - 'src/dev/authoringRecipeCatalog.ts'
      - 'src/services/__tests__/stagingMenuQuality.test.ts'
      - 'src/services/stagingWeekDraft.ts'
      - 'src/services/__tests__/stagingWeekDraft*'
      - 'src/stagingGeneratorCheckMain.tsx'
      - 'scripts/acceptance/staging-week-draft-browser.mjs'
      - 'src/components/StagingRealWeekTest.tsx'
      - 'src/dev/authoringWeekSearchV1.ts'
      - 'src/dev/authoringWeekReport.ts'
      - 'src/dev/referenceCalorieCorridorV1.ts'
      - 'src/dev/__tests__/referenceCalorieCorridorV1.test.ts'
      - 'src/dev/AuthoringWeekViewer.tsx'
      - 'scripts/contracts/recipe-authoring-week-preview-v1.test.ts'
      - 'scripts/contracts/week-input-calorie-capacity-v1.ts'
      - 'scripts/acceptance/staging-real-menu-browser.mjs'
      - 'api/staging-real-week.js'
      - 'scripts/build-staging-real-week-api.mjs'
      - 'docs/premium/staging-reference-catalog-20261108.json'
      - '.github/workflows/staging-real-week-test.yml'
permissions:
  contents: read
jobs:
  contracts:
    # Playwright 1.40 in this lockfile uses the Ubuntu 22.04 system package names.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/build-staging-real-week-api.mjs --check
      - run: node --import tsx --test src/server/__tests__/referenceSavedGoalReaderV1.test.ts src/server/__tests__/stagingRealWeekApiV1.test.ts src/dev/__tests__/authoringWeekViewer.test.tsx src/dev/__tests__/referenceCalorieCorridorV1.test.ts scripts/contracts/recipe-authoring-week-preview-v1.test.ts scripts/contracts/week-input-calorie-capacity-v1.test.ts src/services/__tests__/stagingWeekDraft.test.ts src/services/__tests__/stagingMenuQuality.test.ts
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run build -- --mode staging-preview
        env:
          VITE_POTOK_STAGING_PREVIEW: 'true'
          VITE_SUPABASE_URL: https://ozidryfvhkcbtpnulakq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_synthetic_test_only
      - run: node --import tsx scripts/acceptance/staging-week-draft-browser.mjs
