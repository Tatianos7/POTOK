name: Legacy program mutation quarantine
on:
  pull_request:
    paths:
      - 'scripts/security/legacy-plan-quarantine/**'
      - 'scripts/security/program-history/**'
      - 'scripts/security/program-reads/**'
      - 'scripts/security/server-premium/paywall-review.sql'
      - 'supabase/phase7_2*.sql'
      - 'supabase/phase7_3_2_monetization.sql'
      - 'supabase/migration_drafts/premium_finance_authority_review_v1.sql'
      - 'supabase/migration_drafts/trusted_authority_id_user_review_v1.sql'
      - '.github/workflows/legacy-plan-quarantine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: potok_legacy_plan_quarantine_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U test_admin -d potok_legacy_plan_quarantine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/security/data-api-explicit-grants --ignore-scripts
      - name: Plan preservation, mutation denial and execution annotation compatibility
        env:
          TEST_DATABASE_URL: postgres://test_admin:disposable-test-only@127.0.0.1:5432/potok_legacy_plan_quarantine_test
          SQL_TEST_PG_MODULE: ${{ github.workspace }}/scripts/security/data-api-explicit-grants/node_modules/pg/lib/index.js
        run: node scripts/security/legacy-plan-quarantine/test.mjs
