name: Supabase local Auth PostgREST integration
on:
  pull_request:
    paths:
      - 'scripts/contracts/supabase-local-auth-fixture.sql'
      - 'scripts/contracts/supabase-auth-postgrest-acceptance.mjs'
      - 'scripts/contracts/supabase-local-auth-setup.mjs'
      - 'scripts/contracts/supabase-local-grants-replay.mjs'
      - 'scripts/contracts/supabase-local-grants-assertions.sql'
      - 'supabase/migration_drafts/public_api_privileges_hardening_review_20261021.sql'
      - 'supabase/migration_drafts/premium_rpc_authority_hardening_review_20261021.sql'
      - 'supabase/migration_drafts/program_pause_atomic_review_20261022.sql'
      - '.github/workflows/supabase-local-auth.yml'
  push:
    branches: [audit/supabase-public-grants-20261021]
jobs:
  local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase services without historical POTOK migrations
        run: |
          mkdir -p /tmp/potok-security-migrations-backup
          if [ -d supabase/migrations ]; then mv supabase/migrations /tmp/potok-security-migrations-backup/migrations; fi
          mkdir -p supabase/migrations
          supabase start -x studio,imgproxy,mailpit,analytics,vector,edge-runtime,logflare
      - name: Install fixture into disposable local PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/contracts/supabase-local-auth-fixture.sql
      - name: Replay exact review table grants and Premium RPC in disposable local PostgreSQL
        run: node scripts/contracts/supabase-local-grants-replay.mjs
      - name: Test actual Auth and PostgREST
        run: node scripts/contracts/supabase-local-auth-setup.mjs
      - name: Stop disposable services
        if: always()
        run: supabase stop --no-backup
